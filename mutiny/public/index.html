<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUTINY</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#05070f;--bg2:#120a22;--panel:rgba(14,20,38,.84);--line:rgba(120,150,220,.18);
  --text:#dfe8ff;--muted:#8592b5;--accent:#39e6ff;--danger:#ff3b5c;--gold:#ffc94d;--ok:#4dffa6;
}
body.day{--bg1:#0d2240;--bg2:#24527f;--panel:rgba(12,30,58,.8);--line:rgba(160,200,255,.22);--accent:#7fe9ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Rajdhani,system-ui,sans-serif;color:var(--text);font-size:16px;
  background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;transition:background 1.2s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe3ff,transparent),radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent),radial-gradient(1px 1px at 60px 190px,#ffd9e0,transparent),radial-gradient(1px 1px at 260px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 220px,#bfe9ff,transparent);
  background-size:320px 260px;opacity:.55;animation:drift 120s linear infinite}
body::after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 80% 15%,rgba(179,136,255,.18),transparent 40%),radial-gradient(circle at 10% 85%,rgba(57,230,255,.12),transparent 45%)}
@keyframes drift{to{background-position:-640px 260px}}
h1,h2,h3,.orb{font-family:Orbitron,sans-serif;letter-spacing:.06em}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- ACCUEIL ---------- */
#home{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.hcard{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.logo svg{width:76px;height:76px;filter:drop-shadow(0 0 14px var(--danger))}
.logo h1{font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1}
.logo h1 span{color:var(--danger);text-shadow:0 0 18px rgba(255,59,92,.6)}
.tag{color:var(--muted);font-size:17px;margin-bottom:22px;line-height:1.35}
label.f{display:block;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:.12em;margin:16px 0 8px}
input.t{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px 14px;font:600 18px Rajdhani,sans-serif;outline:none}
input.t:focus{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--danger),#b3123a);border:0;color:#fff;font:700 16px Orbitron,sans-serif;letter-spacing:.08em;padding:15px 22px;border-radius:12px;width:100%;box-shadow:0 10px 30px rgba(255,59,92,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;transform:none;cursor:default}
.btn.sec{background:transparent;border:1px solid var(--line);box-shadow:none;font-size:13px;padding:12px}
.btn.cy{background:linear-gradient(135deg,#39e6ff,#1a8fb3);color:#04121a;box-shadow:0 10px 30px rgba(57,230,255,.25)}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{flex:1}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:20px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-weight:700;margin-top:12px;min-height:20px}
#hcode{text-transform:uppercase;letter-spacing:.2em}
.homewrap{width:100%;max-width:1060px;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:20px;align-items:start}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.5);min-height:200px}
.lcard h2{font-size:16px;letter-spacing:.12em;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lcard h2 .live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.6s infinite}
.lsub{color:var(--muted);font-size:14px;margin-bottom:14px}
.glist{display:grid;gap:10px;max-height:62vh;overflow:auto}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gitem .gi{flex:1;min-width:0}
.gitem .gh{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .gm{font-size:14px;color:var(--muted)}
.gstat{font-family:Orbitron;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.gstat.lobby{background:rgba(77,255,166,.15);color:var(--ok);border:1px solid rgba(77,255,166,.4)}
.gstat.game{background:rgba(255,59,92,.15);color:var(--danger);border:1px solid rgba(255,59,92,.4)}
.gstat.end{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.gjoin{background:var(--accent);color:#04121a;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:15px}
.gjoin:disabled{background:rgba(255,255,255,.08);color:var(--muted);cursor:default}
.gempty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.5}
.vis{display:flex;gap:8px;margin-top:4px}
.vis button{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-weight:700;font-size:15px;line-height:1.2}
.vis button small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.vis button.on{border-color:var(--accent);background:rgba(57,230,255,.14)}
.vispill{font-family:Orbitron;font-size:11px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);letter-spacing:.06em}
@media (max-width:900px){.homewrap{grid-template-columns:1fr}}

/* ---------- JEU ---------- */
#game{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{font-family:Orbitron;font-weight:700;font-size:13px;letter-spacing:.12em;padding:6px 12px;border-radius:8px;background:var(--danger);color:#fff}
body.day .badge{background:var(--gold);color:#2a1a00}
.dayn{font-family:Orbitron;font-size:14px;color:var(--muted)}
.codechip{font-family:Orbitron;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;letter-spacing:.12em}
.hr{display:flex;align-items:center;gap:10px}
.timer{font-family:Orbitron;font-weight:700;font-size:22px;min-width:70px;text-align:right}
.timer.low{color:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.iconbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700}
.layout{display:grid;grid-template-columns:1fr minmax(320px,410px);gap:16px;padding:14px;min-height:0}
.boardwrap{display:flex;align-items:center;justify-content:center;min-height:0}
.board{position:relative;width:min(100%,calc(100vh - 100px));aspect-ratio:1}
.ring{position:absolute;inset:14%;border-radius:50%;border:1px dashed var(--line)}
.ring.r2{inset:28%}
.sweep{position:absolute;inset:14%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 300deg,rgba(255,59,92,.18) 360deg);animation:spin 5s linear infinite}
body.day .sweep{background:conic-gradient(from 0deg,transparent 0 300deg,rgba(127,233,255,.16) 360deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.center{position:absolute;inset:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;padding:6px}
.center .ico svg{width:clamp(34px,7vw,60px);height:clamp(34px,7vw,60px)}
.center .pt{font-family:Orbitron;font-weight:700;font-size:clamp(11px,1.6vw,17px);line-height:1.3}
.center .pp{font-size:clamp(13px,1.6vw,17px);color:var(--accent);font-weight:600;line-height:1.25}
.center .bigcode{font-family:Orbitron;font-weight:900;font-size:clamp(22px,4vw,40px);letter-spacing:.18em;color:var(--accent);text-shadow:0 0 18px rgba(57,230,255,.5)}
.center .ctimer{font-family:Orbitron;font-weight:900;font-size:clamp(18px,3vw,30px)}
.cbtn{background:var(--accent);color:#04121a;border:0;border-radius:8px;padding:7px 14px;font-weight:700;font-size:15px}
.cbtn.red{background:var(--danger);color:#fff}
.cbtn:disabled{opacity:.35;cursor:default}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:clamp(54px,10.5%,104px);transition:opacity .3s,filter .3s}
.ava{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),rgba(0,0,0,.35));border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s,border-color .2s}
.ava svg{width:84%;height:84%}
.seat.me .ava{border-color:var(--accent);box-shadow:0 0 16px rgba(57,230,255,.35)}
.seat.dead{opacity:.45;filter:grayscale(1)}
.seat.off .ava{opacity:.4}
.seat.sel{cursor:pointer}
.seat.sel .ava{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,77,.25),0 0 22px rgba(255,201,77,.45);animation:pulse 1.2s infinite}
.seat.sel:hover .ava{transform:scale(1.08)}
.seat.dim{opacity:.35}
.seat.target .ava{border-color:var(--danger)!important;box-shadow:0 0 24px rgba(255,59,92,.8)!important}
.seat.talking .ava{border-color:var(--ok)!important;border-width:3px;box-shadow:0 0 0 5px rgba(77,255,166,.4),0 0 32px rgba(77,255,166,.75)!important;transform:scale(1.06)}
.seat.talking .nm{color:var(--ok)!important}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,201,77,.12),0 0 28px rgba(255,201,77,.6)}}
.nm{margin-top:4px;font-weight:700;font-size:clamp(11px,1.35vw,15px);white-space:nowrap;text-shadow:0 1px 4px #000;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.rt{font-size:clamp(9px,1.05vw,12px);font-weight:700;padding:1px 7px;border-radius:999px;margin-top:2px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.vb{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--danger);color:#fff;font:700 13px Orbitron;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 12px rgba(255,59,92,.7)}
.crown{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:16px}
.mic{position:absolute;bottom:-4px;right:-4px;font-size:13px;background:#0b1224;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.kick{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#2a3350;color:#fff;font-size:12px;font-weight:700}
.kick:hover{background:var(--danger)}
.rotor ellipse{transform-box:fill-box;transform-origin:center;animation:rot .18s linear infinite alternate}
@keyframes rot{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.eye{animation:eye 2.4s ease-in-out infinite}
@keyframes eye{50%{opacity:.6}}

.side{display:flex;flex-direction:column;gap:10px;min-height:0;max-height:calc(100vh - 80px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
.mycard{display:flex;gap:12px;align-items:center;padding:12px}
.mycard svg{width:52px;height:52px;flex:none}
.mycard .r{font-family:Orbitron;font-weight:700;font-size:15px}
.mycard .d{font-size:14px;color:var(--muted);line-height:1.25}
.settings{padding:14px;display:grid;gap:10px;overflow:auto;max-height:56vh}
.settings h3{font-size:13px;color:var(--muted);letter-spacing:.14em}
.srow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}
.srow label{font-weight:700;font-size:15px}
.srow .val{font-family:Orbitron;font-size:13px;color:var(--accent)}
.srow input[type=range]{grid-column:1/3;width:100%;accent-color:var(--accent)}
#audp select{background:#0b1224;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:600 15px Rajdhani}
#audp .btn{font-size:14px;padding:11px 16px}
.capb{position:absolute;bottom:-4px;right:-6px;font-size:20px;filter:drop-shadow(0 0 6px rgba(255,201,77,.8))}
html.stream .spoil{filter:blur(14px) saturate(.4);pointer-events:none;user-select:none;transition:filter .2s}
html.stream .spoilwrap{position:relative}
#streamBtn.on{background:#ff3b5c;color:#fff;border-color:#ff3b5c}
#peekBtn{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:#1b2340;color:#fff;border:1px solid #ff3b5c;border-radius:999px;padding:10px 18px;font:700 14px Rajdhani,sans-serif;letter-spacing:.04em;box-shadow:0 8px 30px rgba(0,0,0,.6);cursor:pointer}
#peekBtn.hidden{display:none}
.spl{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.spl.open{filter:none}
.scr{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2vh}
.scrboard{width:min(70vw,94vh)}
.scr{gap:2vw}
.scrchat{width:min(26vw,380px);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:clamp(13px,1.8vh,17px)}
.scrchat .m{background:rgba(5,9,22,.55);border-radius:8px;padding:5px 9px;animation:fadein .4s}
html.nochat .scrchat{display:none}html.nochat .scrboard{width:min(96vw,94vh)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
html.overlay,html.overlay body{background:transparent!important}
html.overlay body::before,html.overlay body::after{display:none}
html.overlay .scr-back{display:none}
html.overlay .scrc,html.overlay .seat .nm{text-shadow:0 1px 4px #000,0 0 10px #000}
html.overlay .scrchat .m{background:rgba(5,9,22,.78)}
html.overlay .ring,html.overlay .sweep{opacity:.5}
.vsel{width:100%;background:#0b1224;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:600 14px Rajdhani,sans-serif}
.vmeter{height:10px;background:#0b1224;border:1px solid var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
#vtBar{height:100%;width:0;background:#556;transition:width .06s}
.vstate{font-size:.88em;opacity:.8;margin-top:6px}
#volp .modal{max-height:92vh;overflow:auto}
.vrow{padding:10px 0;border-bottom:1px solid var(--line)}
.vlab{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.vsw{font-weight:500;font-size:.9em;opacity:.85;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.vsl{display:flex;align-items:center;gap:10px}.vsl input{flex:1;accent-color:var(--accent)}.vsl span{width:44px;text-align:right;font-variant-numeric:tabular-nums}
#foot{position:fixed;left:10px;bottom:8px;z-index:30;display:flex;align-items:center;gap:8px;font:500 11px Rajdhani,sans-serif;color:#ffffff55;pointer-events:none}
#foot>*{pointer-events:auto}
#foot{right:10px}
#foot a#legalBtn{color:#ffffff66;text-decoration:none}#foot a#legalBtn:hover{color:#fff;text-decoration:underline}
#foot .kofi{position:fixed;right:10px;bottom:8px}
#foot.hidden,#foot.hidden .kofi{display:none}
#legalp .modal{text-align:left;max-width:560px;max-height:88vh;overflow:auto;font-size:14px;line-height:1.5}
#legalp h3{margin:14px 0 4px;font-size:15px}
#legalp a{color:var(--accent)}
.kofi{display:inline-block;padding:3px 9px;border-radius:999px;background:#ff5e5bcc;color:#fff;font-weight:700;font-size:11px;text-decoration:none;opacity:.85}
.kofi:hover{opacity:1;background:#ff5e5b}
.kofi.hidden{display:none}
#modp label{display:inline-flex;align-items:center;gap:4px;margin-right:10px;cursor:pointer}
#modp .mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
#modp .mrow b{min-width:110px}
#modp .hm{background:#ff3b5c33;border:1px solid #ff3b5c88;color:#fff;border-radius:8px;padding:4px 8px;font-weight:700;cursor:pointer}
.hidden{display:none!important}
.scrc{gap:4px}
.scr-brand{font:900 clamp(10px,1.6vh,16px) Orbitron,sans-serif;letter-spacing:.4em;opacity:.55}
.scr-ico svg{width:min(11vh,90px);height:min(11vh,90px)}
.scr-ph{font:900 clamp(22px,6vh,64px) Orbitron,sans-serif;letter-spacing:.1em;text-shadow:0 0 30px currentColor;line-height:1.1}
body.night .scr-ph{color:#ff3b5c}body.day .scr-ph{color:#ffc94d}
.scr-t{font:700 clamp(20px,5vh,54px) Orbitron,sans-serif;min-height:1.2em}
.scr-sub{font:700 clamp(13px,2.4vh,24px) Orbitron,sans-serif;letter-spacing:.06em;opacity:.9}
.scr-pr{font:600 clamp(14px,2.4vh,24px) Rajdhani,sans-serif;color:var(--accent);max-width:90%;line-height:1.25}
.scr-cap{font:600 clamp(12px,1.9vh,18px) Rajdhani,sans-serif;color:var(--gold);margin-top:4px}
.scr-back{position:fixed;right:14px;bottom:12px;background:transparent;border:1px solid #ffffff22;color:#ffffff55;border-radius:10px;padding:6px 12px;font:600 12px Rajdhani,sans-serif;cursor:pointer}
.scr-back:hover{color:#fff;border-color:#fff8}
.m.last{background:linear-gradient(90deg,rgba(255,201,77,.14),transparent);border-left:3px solid var(--gold);font-style:italic}
.srow select{background:#0b1224;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:600 15px Rajdhani}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
.tg.on{border-color:var(--accent);background:rgba(57,230,255,.14)}
.tg input{display:none}
.settings.ro .tg,.settings.ro input,.settings.ro select{pointer-events:none}
.comp{display:flex;flex-wrap:wrap;gap:6px}
.rc{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-weight:600;font-size:14px}
.rc i{width:9px;height:9px;border-radius:50%;display:inline-block}
.est{font-size:14px;color:var(--muted)}
.voicebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.vbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.vbtn.on{background:var(--ok);color:#03200f;border-color:var(--ok)}
.vbtn.off{background:var(--danger);color:#fff;border-color:var(--danger)}
.vstat{flex-basis:100%;font-size:13.5px;color:var(--muted)}
.chatbox{flex:1;display:flex;flex-direction:column;min-height:260px}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.3}
.log::-webkit-scrollbar{width:6px}.log::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.m{word-wrap:break-word}
.m .w{font-weight:700;margin-right:6px}
.m.sys{color:var(--muted);font-style:italic;text-align:center;font-size:14.5px;padding:2px 0}
.m.big{color:var(--text);font-style:normal;font-family:Orbitron;font-size:13px;letter-spacing:.08em;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;text-align:center}
.m.death{color:#ffb3c0;background:rgba(255,59,92,.1);border-radius:8px;padding:6px 8px;text-align:center}
.m.priv{color:var(--gold);background:rgba(255,201,77,.08);border-radius:8px;padding:6px 8px}
.m.team{background:rgba(255,59,92,.12);border-left:3px solid var(--danger);padding:4px 8px;border-radius:4px}

function composition(n,s){
  const auto=n<=7?1:n<=12?2:3;
  const w=s.wolves>0?Math.max(1,Math.min(s.wolves,Math.floor((n-1)/2))):auto;
  const r=Array(w).fill('eveille');
  if(s.roles.agent&&w>=2)r[0]='agent';
  if(s.roles.virus&&n>=9)r.push('virus');
  for(const k of ['scanner','tech','bouclier','kamikaze','hacker'])if(s.roles[k]&&r.length<n-1)r.push(k);
  while(r.length<n)r.push('drone');
  return r;
}

function onState(v){
  if(!ROOM)return;
  lastState=Date.now();
  const prev=S;S=v;deadline=Date.now()+v.remaining;
  if(!prev||prev.phase!==v.phase)onPhase(prev&&prev.phase,v.phase);
  if(v.phase==='intro'&&(!prev||prev.phase!=='intro'))gameStart();
  gameWatch();
  if(v.phase==='lobby'){ui.introClosed=false;ui.endClosed=false;}
  if(!prev||prev.phase!==v.phase){ui.tech={heal:false,kill:null};ui.tab=0;const w=(v.acts||[]).find(a=>a.type==='wolf');ui.mode=w?w.mode:'convert';}
  try{render()}catch(e){reportErr(e,'render '+v.phase)}
  try{voiceSync()}catch(e){reportErr(e,'voice')}
}

function renderCenter(){
  const me=meP(),a=curAct(),all=acts();
  let ico=isNight()||S.phase==='intro'?MOON:SUN,title='',prompt='',extra='';
  const host=S.me.host;
  if(S.phase==='lobby'){
    const n=S.players.filter(p=>p.connected).length;
    const ok=n>=S.minPlayers;
    $('#center').innerHTML=`<div class="pt">${t('gameCode')}</div><div class="bigcode">${STREAM?'•••••':esc(S.code)}</div>
      <button class="cbtn" id="copyBtn">${t('copyInvite')}</button>
      <div class="pp">${t('androids',{n,m:S.maxPlayers})}${ok?'':t('minimum',{n:S.minPlayers})}</div>
      ${host?`<button class="cbtn red" id="startBtn" ${ok?'':'disabled'}>${t('startGame')}</button><button class="cbtn" id="addBotBtn" ${S.players.length>=S.maxPlayers?'disabled':''}>${t('addBot')}</button>`:`<div class="pp" style="color:var(--muted)">${t('waitHost')}</div>`}`;
    $('#copyBtn').onclick=copyLink;
    if(host){$('#startBtn').onclick=()=>socket.emit('start');$('#addBotBtn').onclick=()=>socket.emit('addbot');}
    return;
  }
  switch(S.phase){
    case 'intro':title=t('introTitle');prompt=t('introPrompt');break;
    case 'night':
      title=t('nightTitle',{n:S.day});
      if(!me.alive)prompt=t('spectAll');
      else if(!a)prompt=t('sleeping');
      else if(a.type==='protect')prompt=a.choice?t('pProtected',{x:pname(a.choice)}):t('pProtect');
      else if(a.type==='wolf'){const m=t(ui.mode==='destroy'?'mDestroy':'mConvert');prompt=a.choice?t('pWolfSet',{x:pname(a.choice),m}):t('pWolf',{m});}
      else if(a.type==='scan')prompt=a.done?t('pScanned',{x:pname(a.choice)}):t('pScan');
      else if(a.type==='hack')prompt=a.awake?t('pHackMask'):t('pHackJam');
      if(a&&a.type==='hack')extra+=`<button class="cbtn red" id="hackBtn">${a.awake?t('hackMaskBtn'):t('hackJamBtn')}</button>`;
      if(a&&a.type==='wolf'&&a.jammed)extra+=`<div class="hint">${t('jammedNote')}</div>`;
      if(all.length>1)extra+=`<div class="tabs">${all.map((x,i)=>`<button data-tab="${i}" class="${i===ui.tab?'on':''}">${t(x.type==='wolf'?'tabWolf':x.type==='protect'?'tabProtect':x.type==='hack'?'tabHack':'tabScan')}</button>`).join('')}</div>`;
      if(a&&a.type==='wolf'){
        if(a.convertOk===false)ui.mode='destroy';
        extra+=`<div class="modes"><button data-mode="convert" class="conv ${ui.mode==='convert'?'on':''}" ${a.convertOk===false?'disabled style="opacity:.4;cursor:default"':''}>${a.convertOk===false?t('modeConvertWait',{n:a.convNext}):t('modeConvert')}</button><button data-mode="destroy" class="dest ${ui.mode==='destroy'?'on':''}">${t('modeDestroy')}</button></div>`;
        if(a.convertOk===false)extra+=`<div class="hint">${t('rechargeNote')}</div>`;
      }
      break;
    case 'tech':title=t('nightTitle',{n:S.day});prompt=a&&a.type==='tech'?(a.done?t('techDone'):t('techTurn')):t('techWait');break;
    case 'choice':title=t('nightTitle',{n:S.day});prompt=a&&a.type==='choice'?(a.done?t('choiceDone'):t('choiceTurn')):t('choiceWait');break;
    case 'dawn':title=t('dawnTitle');prompt=t('dawnPrompt');break;
    case 'discussion':title=t('discTitle',{n:S.day});prompt=me.alive?t('discPrompt'):t('discDead');break;
    case 'vote':title=t('voteTitle');prompt=!me.alive?t('spectator'):a&&a.choice?t('voteSet',{x:pname(a.choice)}):t('votePrompt');break;
    case 'result':title=t('resultTitle');prompt=t('resultPrompt');break;
    case 'election':title=t('electTitle');prompt=!me.alive?t('spectator'):a&&a.choice?t('electSet',{x:pname(a.choice)}):t('electPrompt');break;
    case 'succession':title=t('succTitle');prompt=a&&a.type==='succ'?t('succTurn'):t('succWait',{x:pname(S.succ)});break;
    case 'lastwords':title=t('lastTitle');prompt=S.last===ME?t('lastTurn'):t('lastWait',{x:pname(S.last)});break;
    case 'kamikaze':title=t('kamiTitle');prompt=a&&a.type==='kami'?t('kamiTurn'):t('kamiWait',{x:pname(S.kami)});break;
    case 'end':title=winTitle(S.winner);prompt='';
      extra=host?`<button class="cbtn" id="lobbyBtn">${t('backLobby')}</button>`:`<div class="pp" style="color:var(--muted)">${t('hostCanRestart')}</div>`;
      if(ui.endClosed)extra+=` <button class="cbtn" id="reopenEnd">${t('results')}</button>`;
      break;
  }
  if(S.captain&&inGame()&&!['election','succession','end'].includes(S.phase))extra+=`<div class="hint">${esc(t('capNote',{x:pname(S.captain)}))}</div>`;
  if(isSpec()&&S.phase!=='end')prompt=t('specMode');
  let hint='';
  if(LS.get('mt_games',0)<2&&!isSpec()&&me.alive&&!STREAM){
    if(S.phase==='night')hint=a?(a.type==='wolf'?t('hintWolf'):a.type==='protect'?t('hintProtect'):t('hintScan')):t('hintSleep');
    else if(S.phase==='discussion')hint=S.me.awake?t('hintTeam'):t('hintDisc');
    else if(S.phase==='vote')hint=t('hintVote');
  }
  if(hint)extra+=`<div class="hint">${esc(hint)}</div>`;
  if(host&&['intro','dawn','discussion','result'].includes(S.phase))extra+=`<button class="cbtn" id="skipBtn">${S.phase==='discussion'?t('skipVote'):t('skip')}</button>`;
  $('#center').innerHTML=`<div class="ico">${ico}</div><div class="pt">${esc(title)}</div><div class="ctimer" id="ctimer"></div><div class="pp">${esc(prompt)}</div>${extra}`;
  const sk=$('#skipBtn');if(sk)sk.onclick=()=>socket.emit('skip');
  const hk=$('#hackBtn');if(hk)hk.onclick=()=>{socket.emit('act',{kind:'hack',target:ME});FX.hack();};
  const lb=$('#lobbyBtn');if(lb)lb.onclick=()=>socket.emit('lobby');
  const re=$('#reopenEnd');if(re)re.onclick=()=>{ui.endClosed=false;renderOverlay();renderCenter()};
  document.querySelectorAll('#center [data-tab]').forEach(b=>b.onclick=()=>{ui.tab=+b.dataset.tab;renderSeats();renderCenter()});
  document.querySelectorAll('#center [data-mode]').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    ui.mode=b.dataset.mode;
    const w=curAct();
    if(w&&w.type==='wolf'&&w.choice)socket.emit('act',{kind:'wolf',target:w.choice,mode:ui.mode});
    renderCenter();
  });
}

function channel(){

}

/* journal (gardé en mémoire pour pouvoir changer de langue) */
const MUTEV=new Set(),MUTEC=new Set();
function spoilMsg(d){
  const inner=d.innerHTML;
  d.innerHTML=`<span class="spl" title="${esc(STX('secret'))}">${inner}</span>`;
  const sp=d.firstChild;sp.onclick=()=>{sp.classList.toggle('open');};
}
function msgEl(m){
  const d=document.createElement('div');
  if(m.from&&MUTEC.has(m.from)&&!SCR)d.style.display='none';
  if(m.from){
    const tag=m.k==='team'?t('tagTeam'):m.k==='dead'?t('tagDead'):m.k==='spec'?t('tagSpec'):m.k==='last'?'💬 '+t('lastTag'):'';
    d.className='m '+(m.k==='chat'?'':m.k);
    d.innerHTML=`${tag?`<span class="chan">${tag}</span>`:''}${m.bot?`<span class="bt">${t('botTag')}</span>`:''}<span class="w" style="color:${esc(m.color)}">${esc(m.name)}</span>${esc(tr(m.text))}`;
    if(STREAM&&m.k==='team')spoilMsg(d);
  }else{
    d.className='m '+(m.k==='big'?'sys big':m.k==='death'?'sys death':m.k==='priv'?'priv':m.k==='vote'?'vote':m.k==='team'?'team':'sys');
    d.textContent=tr(m.text);
    if(STREAM&&(m.k==='priv'||m.k==='team'))spoilMsg(d);
  }
  return d;
}
function addMsg(m,live){
  LOG.push(m);if(LOG.length>300)LOG.shift();
  const l=$('#log');const atB=l.scrollHeight-l.scrollTop-l.clientHeight<80;
  l.appendChild(msgEl(m));if(atB||!live)l.scrollTop=l.scrollHeight;
  if(live)onFx(m);
  if(live&&m.say)narrate(tr(m.text));
  if(live&&m.k==='priv'&&!STREAM)narrate(tr(m.text),true);
}
function rebuildLog(){const l=$('#log');l.innerHTML='';LOG.forEach(m=>l.appendChild(msgEl(m)));l.scrollTop=l.scrollHeight;}

/* minuteur */
function tick(){
  if(!S)return;
  const s=deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):0;
  const show=S.remaining>0&&S.phase!=='lobby'&&S.phase!=='end';
  const txt=show?(s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s}s`):'';
  $('#timer').textContent=txt?'⏱ '+txt:'';
  $('#timer').classList.toggle('low',show&&s<=5);
  const ct=$('#ctimer');if(ct)ct.textContent=txt;
  tickSound(s,show);
}
setInterval(tick,250);

let NARR=LS.get('dr_narr',true);
function narrate(text,quiet){
  if(!NARR||!('speechSynthesis' in window))return;
  const clean=String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').trim();
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  u.lang=LANG==='fr'?'fr-FR':'en-US';u.rate=1.05;u.volume=Math.min(1,(quiet?.7:1)*volF('narr'));
  const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(LANG));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* =========================================================
   SONS (synthétisés, aucun fichier), MUSIQUE et ANIMATIONS
   ========================================================= */
const ANIM={};
const VOL=Object.assign({music:70,fx:70,narr:100,voice:100},LS.get('mt_vol',{}));
const volF=k=>Math.max(0,Math.min(100,+VOL[k]||0))/(k==='music'||k==='fx'?70:100);
const SND={ctx:null,master:null,fx:LS.get('mt_fx',true),music:LS.get('mt_music',true),mus:null,mood:'night'};
function actx(){
  if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(SND.ctx.state==='suspended')SND.ctx.resume().catch(()=>{});
  return SND.ctx;
}
function outNode(){const c=actx();if(!c)return null;if(!SND.master){SND.master=c.createGain();SND.master.gain.value=.9*volF('fx');SND.master.connect(c.destination);}return SND.master;}
document.addEventListener('pointerdown',()=>{if(actx()&&SND.music&&!SND.mus&&ROOM)startMusic();});
function tone(o){
  if(!SND.fx)return;const c=actx(),m=outNode();if(!c||!m)return;
  const t0=c.currentTime+(o.delay||0),d=o.dur||.3;
  const osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f||440,t0);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol||.15,t0+(o.attack||.01));g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  osc.connect(g);g.connect(m);osc.start(t0);osc.stop(t0+d+.05);
}
function noise(o){
  if(!SND.fx)return;const c=actx(),m=outNode();if(!c||!m)return;
  const t0=c.currentTime+(o.delay||0),d=o.dur||.5;
  const buf=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const src=c.createBufferSource();src.buffer=buf;
  const f=c.createBiquadFilter();f.type=o.ftype||'lowpass';f.frequency.setValueAtTime(o.filter||1500,t0);if(o.sweep)f.frequency.exponentialRampToValueAtTime(o.sweep,t0+d);
  const g=c.createGain();g.gain.setValueAtTime(o.vol||.3,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  src.connect(f);f.connect(g);g.connect(m);src.start(t0);src.stop(t0+d);
}
const FX={
  night(){tone({f:440,f2:220,type:'sawtooth',dur:.7,vol:.05});tone({f:440,f2:220,type:'sawtooth',dur:.7,vol:.05,delay:.8});tone({f:110,f2:55,dur:1.6,vol:.12});},
  day(){[523,659,784,1046].forEach((f,i)=>tone({f,type:'triangle',dur:.6,vol:.07,delay:i*.11}));},
  vote(){tone({f:900,f2:600,type:'square',dur:.07,vol:.035});},
  voteOpen(){tone({f:660,type:'triangle',dur:.25,vol:.07});tone({f:880,type:'triangle',dur:.3,vol:.07,delay:.15});},
  tick(){tone({f:1200,dur:.05,vol:.045});},
  hack(){for(let i=0;i<7;i++)tone({f:200+Math.random()*1400,type:'square',dur:.06,vol:.045,delay:i*.07});noise({dur:.6,vol:.12,filter:4000,ftype:'bandpass',delay:.1});tone({f:160,f2:40,type:'sawtooth',dur:.7,vol:.09,delay:.5});},
  boom(){noise({dur:1.3,vol:.45,filter:1800,sweep:60});tone({f:110,f2:30,dur:1.1,vol:.32});},
  zap(){tone({f:2000,f2:80,type:'sawtooth',dur:.5,vol:.09});noise({dur:.35,vol:.16,filter:5000,ftype:'highpass'});},
  eject(){noise({dur:1.2,vol:.22,filter:300,sweep:4000,ftype:'bandpass'});tone({f:200,f2:900,dur:1.1,vol:.08});},
  convert(){[392,494,587,784,988].forEach((f,i)=>tone({f,type:'square',dur:.12,vol:.045,delay:i*.08}));tone({f:196,f2:98,type:'sawtooth',dur:.8,vol:.05,delay:.4});},
  win(){[523,659,784,1046,1318].forEach((f,i)=>tone({f,type:'triangle',dur:.45,vol:.09,delay:i*.13}));},
  lose(){[440,392,349,262].forEach((f,i)=>tone({f,type:'sawtooth',dur:.5,vol:.05,delay:i*.18}));},
  click(){tone({f:700,type:'triangle',dur:.06,vol:.04});},
  alert(){for(let i=0;i<3;i++){tone({f:620,f2:880,type:'square',dur:.35,vol:.05,delay:i*.4});}}
};
/* musique d'ambiance générative : nappe filtrée + basse, accord mineur la nuit, majeur le jour */
function startMusic(){
  const c=actx();if(!c||SND.mus)return;
  const g=c.createGain();g.gain.value=0;g.connect(c.destination);
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=600;f.Q.value=3;f.connect(g);
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.06;lg.gain.value=300;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  const oscs=[0,1,2].map(i=>{const o=c.createOscillator();o.type=i===2?'triangle':'sawtooth';o.detune.value=(i-1)*7;o.connect(f);o.start();return o;});
  const sub=c.createOscillator(),sg=c.createGain();sub.type='sine';sg.gain.value=.45;sub.connect(sg);sg.connect(g);sub.start();
  const pulse=c.createOscillator(),pg=c.createGain();pulse.frequency.value=.25;pg.gain.value=.012;pulse.connect(pg);pg.connect(g.gain);pulse.start();
  SND.mus={g,f,oscs,sub,lfo,pulse};
  setMood(SND.mood,true);
  g.gain.linearRampToValueAtTime(.03*volF('music'),c.currentTime+3);
}
function stopMusic(){
  const m=SND.mus;if(!m)return;SND.mus=null;
  const c=SND.ctx;m.g.gain.cancelScheduledValues(c.currentTime);m.g.gain.setValueAtTime(m.g.gain.value,c.currentTime);m.g.gain.linearRampToValueAtTime(0,c.currentTime+1);
  setTimeout(()=>{[...m.oscs,m.sub,m.lfo,m.pulse].forEach(o=>{try{o.stop()}catch(e){}});m.g.disconnect();},1200);
}
function setMood(mood,now){
  SND.mood=mood;const m=SND.mus;if(!m)return;
  const c=SND.ctx,t0=c.currentTime,ramp=now?.05:4;
  const night=mood==='night',root=night?55:65.41,iv=night?[0,3,7]:[0,4,7];
  m.oscs.forEach((o,i)=>o.frequency.linearRampToValueAtTime(root*2*Math.pow(2,iv[i]/12),t0+ramp));
  m.sub.frequency.linearRampToValueAtTime(root,t0+ramp);
  m.f.frequency.linearRampToValueAtTime(night?450:900,t0+ramp);
}
function flash(cls){const el=$('#flash');el.className='';void el.offsetWidth;el.className=cls;}
const FXMAP={last:['a-glitch',null],hack:['a-hack','hack'],self:['a-boom','boom'],kami:['a-boom','boom'],emp:['a-zap','zap'],vote:['a-eject','eject'],convert:['a-glitch','convert'],alert:[null,'alert']};
function onFx(m){
  if(!m.fx)return;
  if(m.k==='vote'){FX.vote();return}

  if(m.who&&x[0]){ANIM[m.who]={cls:x[0],until:Date.now()+1700};if(S)renderSeats();setTimeout(()=>{if(S)renderSeats()},1800);}
  if(x[1])setTimeout(()=>FX[x[1]](),m.fx==='convert'?0:250);
  if(x[1]==='boom')flash('f-boom');
}
function onPhase(prev,ph){
  const nightish=['night','tech','choice','intro','lobby'].includes(ph);
  setMood(nightish?'night':'day');
  if(ph==='night'){FX.night();flash('f-night');}
  else if(ph==='dawn'){FX.day();flash('f-day');}

    if(!isSpec()){LS.set('mt_games',LS.get('mt_games',0)+1);(myTeam()===S.winner?FX.win:FX.lose)();gameEnd();}
    else FX.win();
  }
}

  }else if(k==='t4'){

      +`<div class="out">${st.v==null?'':(st.v===st.awake?`<b style="color:var(--ok)">${t('t5r2',{x:TNAMES[st.v]})}</b>`:t('t5r1',{x:TNAMES[st.v]}))}</div>`;

    <div class="tnav">${TUTO.i>0?`<button class="btn sec" data-nav="-1">${t('tutoPrev')}</button>`:`<button class="btn sec" data-nav="x">${t('tutoClose')}</button>`}
      ${TUTO.i<n-1?`<button class="btn cy" data-nav="1">${t('tutoNext')}</button>`:`<button class="btn violet" data-nav="play">${t('tutoPlay')}</button>`}</div>
    ${TUTO.i===n-1?`<button class="btn sec" data-nav="x">${t('tutoClose')}</button>`:''}
  </div></div>`;
  el.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{

    <div class="achgrid">${ACHS.map(([id,ic])=>{const [n,d]=achTxt(id),on=!!ACH[id];return `<div class="${on?'on':''}"><i>${on?ic:'🔒'}</i><b>${esc(n)}</b><span>${esc(d)}</span></div>`}).join('')}</div>
    <p class="note">${t('profNote')}</p>
    <div class="tnav"><button class="btn sec" id="profReset">${t('resetStats')}</button><button class="btn sec" id="profClose">${t('tutoClose')}</button></div>
  </div></div>`;
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{PROF.color=b.dataset.c;FX.click();renderProfile()});
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{PROF.visor=b.dataset.v;FX.click();renderProfile()});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{PROF.acc=b.dataset.a;FX.click();renderProfile()});
  $('#profSave').onclick=()=>{LOOK=Object.assign({},PROF);LS.set('mt_look',LOOK);FX.convert();closeProfile();toast('✓');$('#logoDrone').innerHTML=droneSVG(LOOK.color||RED,RED,false,true,LOOK);};
  $('#profClose').onclick=closeProfile;
  $('#profReset').onclick=()=>{ST={games:0,wins:0,winsE:0,winsV:0,offered:0,accepted:0,selfd:0,survived:0,soloWins:0,convWins:0,detect:0};ACH={};LS.set('mt_stats',ST);LS.set('mt_ach',ACH);renderProfile();};
}

applyStatic();renderVis();renderList();applyStream();
$('#logoDrone').innerHTML=droneSVG(LOOK.color||RED,RED,false,true,LOOK);

/* =========================================================
   VOCAL (WebRTC pair-à-pair, règles décidées par le serveur)
   ========================================================= */
const V={on:false,stream:null,track:null,muted:false,pcs:{},ctx:null,an:{},talking:new Set()};
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
let iceReady=null;
function loadIce(){if(!iceReady)iceReady=fetch('/ice').then(r=>r.json()).then(j=>{if(j&&Array.isArray(j.iceServers)&&j.iceServers.length)ICE.iceServers=ICE.iceServers.concat(j.iceServers)}).catch(()=>{});return iceReady;}
loadIce();
document.addEventListener('pointerdown',()=>{if(!V.blocked)return;V.blocked=false;try{V.ctx&&V.ctx.resume()}catch(e){}Object.values(V.pcs).forEach(o=>o.audio&&o.audio.play().catch(()=>{V.blocked=true}))});

async function joinVoice(){
  if(V.on)return;
  V.on=true;
  try{V.ctx=V.ctx||new (window.AudioContext||window.webkitAudioContext)();V.ctx.resume();}catch(e){}
  const spec=isSpec();
  const micP=spec?null:getMic();          // demande du micro tout de suite, pendant le clic
  await Promise.race([loadIce(),new Promise(r=>setTimeout(r,3000))]);
  if(spec){socket.emit('voice',true);renderVoiceBar();voiceSync();return}
  try{
    V.stream=await micP;
    V.track=V.stream.getAudioTracks()[0];
    addAnalyser(ME,V.stream);
  }catch(e){V.track=null;micError(e);}
  socket.emit('voice',true);
  renderVoiceBar();voiceSync();
}
function leaveVoice(notify){
  V.on=false;
  Object.keys(V.pcs).forEach(closePC);
  if(V.stream)V.stream.getTracks().forEach(t=>t.stop());
  V.stream=null;V.track=null;
  Object.keys(V.an).forEach(k=>delete V.an[k]);V.talking.clear();
  if(notify)socket.emit('voice',false);
  if(S)renderVoiceBar();
}
function voiceSync(){
  if(!S)return;
  if(!S.settings.voice&&V.on){leaveVoice(false);return}
  if(!V.on)return;
  const specIds=new Set((S.spectators||[]).map(x=>x.id));
  const peers=S.players.concat(S.spectators||[]).filter(p=>p.id!==ME&&p.voice&&p.connected&&!(isSpec()&&specIds.has(p.id)));
  const ids=new Set(peers.map(p=>p.id));
  Object.keys(V.pcs).forEach(id=>{if(!ids.has(id))closePC(id)});
  peers.forEach(p=>{if(!V.pcs[p.id]&&ME<p.id)createPC(p.id,true)});
  Object.keys(V.pcs).forEach(applyTrack);
}
function applyTrack(id){
  const o=V.pcs[id];if(!o||!S)return;
  const want=(V.track&&!V.muted&&S.voice.to.includes(id))?V.track:null;
  if(o.sender&&o.cur!==want){o.cur=want;o.sender.replaceTrack(want).catch(()=>{});}
  if(o.audio){o.audio.muted=!S.voice.from.includes(id)||MUTEV.has(id);o.audio.volume=Math.min(1,volF('voice'));}
}
function createPC(id,initiator){
  const pc=new RTCPeerConnection(ICE);
  const o={pc,sender:null,cur:undefined,audio:null,queue:[]};
  V.pcs[id]=o;
  pc.onicecandidate=e=>{if(e.candidate)socket.emit('rtc',{to:id,data:{c:e.candidate}})};
  pc.ontrack=e=>{
    const stream=e.streams[0]||new MediaStream([e.track]);
    if(!o.audio){o.audio=document.createElement('audio');o.audio.autoplay=true;o.audio.playsInline=true;$('#audiobox').appendChild(o.audio);}
    applySink(o.audio);o.audio.srcObject=stream;o.audio.play().catch(()=>{V.blocked=true;toast(LANG==='en'?'🔊 Click anywhere to enable voice audio':'🔊 Clique n’importe où pour activer le son du vocal')});
    addAnalyser(id,stream);applyTrack(id);
  };
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')reportErr('connexion vocale échouée (relais TURN '+(ICE.iceServers.length>1?'présent':'absent')+')','voice');if(['failed','closed'].includes(pc.connectionState)&&V.pcs[id]===o){closePC(id);setTimeout(voiceSync,1500)}};
  if(initiator){
    const tr=pc.addTransceiver('audio',{direction:'sendrecv'});
    o.sender=tr.sender;applyTrack(id);
    pc.createOffer().then(of=>pc.setLocalDescription(of)).then(()=>socket.emit('rtc',{to:id,data:{sdp:pc.localDescription}})).catch(()=>{});
  }
  return o;
}
function closePC(id){
  const o=V.pcs[id];if(!o)return;
  delete V.pcs[id];
  try{o.pc.close()}catch(e){}
  if(o.audio){o.audio.srcObject=null;o.audio.remove()}
  delete V.an[id];V.talking.delete(id);
}
socket.on('rtc',async({from,data})=>{
  if(!V.on||!data)return;
  try{
    if(data.sdp&&data.sdp.type==='offer'){
      if(V.pcs[from])closePC(from);
      const o=createPC(from,false);
      await o.pc.setRemoteDescription(data.sdp);
      const tr=o.pc.getTransceivers()[0];
      if(tr){tr.direction='sendrecv';o.sender=tr.sender;applyTrack(from);}
      const ans=await o.pc.createAnswer();await o.pc.setLocalDescription(ans);
      socket.emit('rtc',{to:from,data:{sdp:o.pc.localDescription}});
      for(const c of o.queue)await o.pc.addIceCandidate(c).catch(()=>{});o.queue=[];
    }else if(data.sdp&&data.sdp.type==='answer'){
      const o=V.pcs[from];if(!o)return;
      await o.pc.setRemoteDescription(data.sdp);
      for(const c of o.queue)await o.pc.addIceCandidate(c).catch(()=>{});o.queue=[];
    }else if(data.c){
      const o=V.pcs[from];if(!o)return;
      if(o.pc.remoteDescription)await o.pc.addIceCandidate(data.c).catch(()=>{});else o.queue.push(data.c);
    }
  }catch(e){console.warn('rtc',e)}
});
/* ---------- réglages audio : micro, sortie, test, état des connexions ---------- */
const AUD={mic:LS.get('mt_mic',''),out:LS.get('mt_out','')};
const EN=()=>LANG==='en';
/* micro : essaie le micro choisi, sinon celui par défaut (les identifiants d'appareils changent parfois) */
async function getMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Object.assign(new Error('nomedia'),{name:'NoMedia'});
  let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:micConstraints(true)});}
  catch(e){
    // micro choisi introuvable (débranché, identifiant changé) : on prend celui par défaut, sans oublier le choix
    if(AUD.mic&&e&&(e.name==='OverconstrainedError'||e.name==='NotFoundError')){
      st=await navigator.mediaDevices.getUserMedia({audio:micConstraints(false)});
      toast(LANG==='en'?'🎙️ The chosen microphone is not available: using the default one.':'🎙️ Le micro choisi n’est pas disponible : micro par défaut utilisé.');
    }else throw e;
  }
  const tr=st.getAudioTracks()[0];
  console.log('[micro]',tr&&tr.label,tr&&tr.getSettings&&tr.getSettings().deviceId);
  return st;
}
function micError(e){
  const n=e&&e.name,EN=LANG==='en';
  const msg=n==='NotAllowedError'||n==='SecurityError'?(EN?'🎙️ Microphone blocked: click the padlock left of the address bar, allow the microphone, then reload the page.':'🎙️ Micro bloqué : clique sur le cadenas à gauche de l’adresse, autorise le micro, puis recharge la page.')
    :n==='NotFoundError'||n==='OverconstrainedError'?(EN?'🎙️ No microphone found: plug one in or check your system sound settings.':'🎙️ Aucun micro détecté : branche-en un ou vérifie les réglages son de ton ordinateur.')
    :n==='NotReadableError'||n==='AbortError'?(EN?'🎙️ Microphone busy: close the other apps using it (Discord, Teams…) and try again.':'🎙️ Micro occupé : ferme les autres applis qui l’utilisent (Discord, Teams…) puis réessaie.')
    :n==='NoMedia'?(EN?'🎙️ This browser cannot use a microphone here (use Chrome, Edge or Firefox over https).':'🎙️ Ce navigateur ne peut pas utiliser de micro ici (utilise Chrome, Edge ou Firefox en https).')
    :t('micUnavailable');
  toast(msg);reportErr('micro: '+(n||e),'voice');
}
function micConstraints(useChoice){const c={echoCancellation:true,noiseSuppression:true,autoGainControl:true};if(useChoice!==false&&AUD.mic)c.deviceId={exact:AUD.mic};return c;}
const canSink=typeof HTMLMediaElement!=='undefined'&&'setSinkId' in HTMLMediaElement.prototype;
function applySink(el){if(canSink&&el&&AUD.out)el.setSinkId(AUD.out).catch(()=>{});}
async function setMic(id){
  AUD.mic=id;LS.set('mt_mic',id);
  if(!V.on||isSpec())return;
  try{
    const ns=await getMic();
    if(V.stream)V.stream.getTracks().forEach(t=>t.stop());
    V.stream=ns;V.track=ns.getAudioTracks()[0];addAnalyser(ME,ns);
    Object.values(V.pcs).forEach(o=>{o.cur=undefined});Object.keys(V.pcs).forEach(applyTrack);
    toast((EN()?'🎙️ Microphone: ':'🎙️ Micro : ')+(V.track&&V.track.label||'?'));
  }catch(e){micError(e);}
  renderVoiceBar();
}
function setOut(id){AUD.out=id;LS.set('mt_out',id);Object.values(V.pcs).forEach(o=>applySink(o.audio));}
function testSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();const dst=ctx.createMediaStreamDestination();
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=660;g.gain.value=.25;o.connect(g);g.connect(dst);
    const el=new Audio();el.srcObject=dst.stream;applySink(el);
    o.start();el.play().catch(()=>{});
    setTimeout(()=>{o.frequency.value=880},250);setTimeout(()=>{o.stop();el.pause();ctx.close()},600);
  }catch(e){toast('?')}
}
async function peerState(o){
  const st=o.pc.connectionState;
  if(st==='failed')return['fail',EN()?'failed':'échec'];
  if(st!=='connected')return['wait',EN()?'connecting…':'connexion…'];
  try{
    const stats=await o.pc.getStats();let pair=null,loc={};
    stats.forEach(r=>{if(r.type==='transport'&&r.selectedCandidatePairId)pair=stats.get(r.selectedCandidatePairId);});
    if(!pair)stats.forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.state==='succeeded')pair=r;});
    if(pair)loc=stats.get(pair.localCandidateId)||{};
    const rem=pair&&stats.get(pair.remoteCandidateId)||{};
    const relay=loc.candidateType==='relay'||rem.candidateType==='relay';
    let recv=0;stats.forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='audio')recv=r.bytesReceived||0;});
    return['ok',(relay?(EN()?'connected via relay':'connecté via relais'):(EN()?'connected direct':'connecté en direct'))+(recv?` · ${Math.round(recv/1024)} Ko ${EN()?'received':'reçus'}`:'')];
  }catch(e){return['ok',EN()?'connected':'connecté']}
}
let audTimer=null;
function closeAudio(){const el=$('#audp');if(el)el.remove();clearInterval(audTimer);audTimer=null;}
async function openAudio(){
  let devs=[];try{devs=await navigator.mediaDevices.enumerateDevices();}catch(e){}
  const mics=devs.filter(d=>d.kind==='audioinput'),outs=devs.filter(d=>d.kind==='audiooutput');
  const opt=(list,cur,def)=>`<option value="">${def}</option>`+list.filter(d=>d.deviceId&&d.deviceId!=='default').map((d,i)=>`<option value="${esc(d.deviceId)}" ${d.deviceId===cur?'selected':''}>${esc(d.label||('#'+(i+1)))}</option>`).join('');
  closeAudio();
  const el=document.createElement('div');el.id='audp';
  const relay=ICE.iceServers.length>1;
  el.innerHTML=`<div class="ov" style="z-index:60"><div class="modal" style="text-align:left">
    <h2 style="margin:0 0 14px">⚙️ ${EN()?'Audio settings':'Réglages audio'}</h2>
    <label style="display:block;margin:10px 0 4px">🎙️ ${EN()?'Microphone':'Micro'}</label>
    <select id="audMic" style="width:100%">${opt(mics,AUD.mic,EN()?'System default':'Par défaut du système')}</select>
    <label style="display:block;margin:14px 0 4px">🎧 ${EN()?'Output (speakers / headset)':'Sortie (haut-parleurs / casque)'}</label>
    ${canSink?`<select id="audOut" style="width:100%">${opt(outs,AUD.out,EN()?'System default':'Par défaut du système')}</select>`:`<div style="opacity:.7;font-size:.9em">${EN()?'Your browser does not allow choosing the output here: change it in your system sound settings, or use Chrome / Edge.':'Ton navigateur ne permet pas de choisir la sortie ici : change-la dans les réglages son de ton ordinateur, ou utilise Chrome / Edge.'}</div>`}
    <button class="btn" id="audTest" style="margin-top:12px">🔔 ${EN()?'Test sound':'Tester le son'}</button>
    <h3 style="margin:18px 0 6px">📡 ${EN()?'Connection with each player':'Connexion avec chaque joueur'}</h3>
    <div style="font-size:.85em;opacity:.7;margin-bottom:6px">${EN()?'Relay server':'Serveur relais'} : ${relay?'✅':'❌ '+(EN()?'not configured':'non configuré')}</div>
    <div id="audPeers" style="font-size:.95em"></div>
    <div style="text-align:center;margin-top:18px"><button class="btn primary" id="audClose">${EN()?'Close':'Fermer'}</button></div>
  </div></div>`;
  document.body.appendChild(el);
  $('#audMic').onchange=e=>setMic(e.target.value);
  const ao=$('#audOut');if(ao)ao.onchange=e=>{setOut(e.target.value);testSound();};
  $('#audTest').onclick=testSound;
  $('#audClose').onclick=closeAudio;
  el.querySelector('.ov').onclick=e=>{if(e.target.classList.contains('ov'))closeAudio()};
  const upd=async()=>{
    const box=$('#audPeers');if(!box)return closeAudio();
    const ids=Object.keys(V.pcs);
    if(!ids.length){box.innerHTML=`<div style="opacity:.7">${EN()?'No other player in voice chat right now.':'Aucun autre joueur dans le vocal pour l’instant.'}</div>`;return;}
    const rows=await Promise.all(ids.map(async id=>{const [k,txt]=await peerState(V.pcs[id]);const ic=k==='ok'?'🟢':k==='fail'?'🔴':'🟡';return `<div>${ic} <b>${esc(pname(id))}</b> — ${esc(txt)}</div>`;}));
    if($('#audPeers'))$('#audPeers').innerHTML=rows.join('');
  };
  upd();audTimer=setInterval(upd,1500);
}
function addAnalyser(id,stream){
  if(!V.ctx)return;
  try{const src=V.ctx.createMediaStreamSource(stream);const an=V.ctx.createAnalyser();an.fftSize=1024;src.connect(an);V.an[id]={an,buf:new Float32Array(an.fftSize)};}catch(e){}
}
/* détection de la parole : micro local via WebAudio, joueurs distants via le niveau audio WebRTC */
V.loud={};
function levelOf(id){
  if(id!==ME){
    const o=V.pcs[id];
    if(o){
      try{
        const r=o.pc.getReceivers().find(r=>r.track&&r.track.kind==='audio');
        if(r&&r.getSynchronizationSources){
          const src=r.getSynchronizationSources();
          if(src.length)return Math.max(...src.map(x=>(Date.now()-x.timestamp<500?x.audioLevel||0:0)))*1.4;
        }
      }catch(e){}
    }
  }
  const a=V.an[id];if(!a)return 0;
  a.an.getFloatTimeDomainData(a.buf);
  let sum=0;for(let k=0;k<a.buf.length;k++)sum+=a.buf[k]*a.buf[k];
  return Math.sqrt(sum/a.buf.length);
}
document.addEventListener('click',()=>{if(V.ctx&&V.ctx.state==='suspended')V.ctx.resume().catch(()=>{})});
setInterval(()=>{
  if(!V.on||!S)return;
  const now=Date.now();
  const ids=[ME,...Object.keys(V.pcs)];
  let changed=false;
  for(const id of ids){
    let loud=levelOf(id)>0.015;
    if(id===ME)loud=loud&&!!V.track&&!V.muted&&(S.voice.to.length>0||S.phase==='lobby'||S.phase==='end');
    else{const o=V.pcs[id];if(!o||(o.audio&&o.audio.muted))loud=false}
    if(loud)V.loud[id]=now;
    const talking=now-(V.loud[id]||0)<400;
    if(talking!==V.talking.has(id)){changed=true;talking?V.talking.add(id):V.talking.delete(id);if(id===ME)socket.emit('talking',talking);}
  }
  for(const id of [...V.talking])if(!ids.includes(id)){V.talking.delete(id);changed=true}
  if(changed)document.querySelectorAll('.seat').forEach(s=>s.classList.toggle('talking',V.talking.has(s.dataset.id)));
},100);
</script>
